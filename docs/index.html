<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS5 Pro Tracker</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--fg:#14171c;--mute:#6b7280;--bd:#e3e5ea;--g:#16a34a;--r:#dc2626;--y:#9ca3af;--ac:#0070d1}
@media (prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b22;--fg:#e8eaee;--mute:#8b93a1;--bd:#262c36;--g:#22c55e;--r:#ef4444;--y:#6b7280;--ac:#3b9cff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:8px 0 2px}
h2{font-size:1.05rem;margin:28px 0 8px}
.sub{color:var(--mute);font-size:.85rem;margin-bottom:16px}
.card{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.card.hl{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.dot{width:16px;height:16px;border-radius:50%;flex:none;background:var(--y)}
.in_stock .dot{background:var(--g);box-shadow:0 0 8px var(--g)}
.out_of_stock .dot{background:var(--r)}
.info{flex:1;min-width:0}
.name{font-weight:600}
.meta{color:var(--mute);font-size:.85rem}
.lbl{font-size:.85rem}
.btn{background:var(--ac);color:#fff;text-decoration:none;padding:8px 12px;border-radius:8px;font-size:.9rem;white-space:nowrap}
ul{list-style:none;padding:0;margin:0}
li{padding:8px 0;border-bottom:1px solid var(--bd);font-size:.9rem}
.err{color:var(--r)}
.warn{background:var(--r);color:#fff;border-radius:10px;padding:10px 14px;margin-bottom:12px}
</style>
</head>
<body>
<main>
<h1>🎮 PS5 Pro Tracker</h1>
<div class="sub" id="upd">Lade…</div>
<div id="warn"></div>
<div id="stores"></div>
<h2>Nicht überwacht</h2>
<ul id="off"></ul>
<h2>Verlauf</h2>
<ul id="hist"></ul>
</main>
<script>
const L={in_stock:'Verfügbar',out_of_stock:'Ausverkauft',unknown:'Unbekannt'};
const R={blocked:'Blockiert (Bot-Schutz)',not_found:'Seite nicht gefunden – URL prüfen',error:'Shop-Fehler'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=p=>p==null?'':p.toLocaleString('de-DE',{style:'currency',currency:'EUR'});
function ago(iso){
  if(!iso)return 'nie';
  const s=Math.max(0,(Date.now()-new Date(iso))/1000);
  if(s<90)return 'gerade eben';
  if(s<3600)return 'vor '+Math.round(s/60)+' Min.';
  if(s<86400)return 'vor '+Math.round(s/3600)+' Std.';
  return 'vor '+Math.round(s/86400)+' Tg.';
}
async function load(){
  try{
    const r=await fetch('status.json',{cache:'no-store'});
    if(!r.ok)throw new Error(r.status);
    const d=await r.json();
    document.getElementById('upd').textContent='Aktualisiert '+ago(d.updatedAt);
    const stale=Date.now()-new Date(d.updatedAt)>90*60e3;
    document.getElementById('warn').innerHTML=stale?'<div class="warn">⚠️ Seit über 90 Min. keine Prüfung – Status evtl. veraltet. GitHub Actions prüfen.</div>':'';
    const st=[...d.stores].sort((a,b)=>a.priority-b.priority);
    document.getElementById('stores').innerHTML=st.map(s=>`
      <div class="card ${esc(s.status)} ${s.priority===1?'hl':''}">
        <span class="dot"></span>
        <div class="info">
          <div class="name">${esc(s.name)}</div>
          <div class="lbl">${s.status==='unknown'&&R[s.reason]||L[s.status]}${s.price!=null?' · '+eur(s.price):''}</div>
          <div class="meta">${s.lastInStockAt?'Zuletzt verfügbar '+ago(s.lastInStockAt):'Noch nie verfügbar gesehen'}</div>
        </div>
        <a class="btn" href="${esc(s.url)}" target="_blank" rel="noopener">Zum Shop</a>
      </div>`).join('');
    document.getElementById('off').innerHTML=(d.disabled||[]).map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a> <span class="meta">– Bot-Schutz, bitte selbst prüfen</span></li>`).join('')||'<li class="meta">Keine.</li>';
    document.getElementById('hist').innerHTML=(d.history||[]).map(h=>
      `<li>${new Date(h.at).toLocaleString('de-DE')} · <b>${esc(h.name)}</b>: ${L[h.from]||h.from} → ${L[h.to]||h.to}${h.price!=null?' ('+eur(h.price)+')':''}</li>`
    ).join('')||'<li class="meta">Noch keine Änderungen.</li>';
  }catch(e){
    document.getElementById('upd').innerHTML='<span class="err">status.json konnte nicht geladen werden.</span>';
  }
}
load();
setInterval(load,300000);
</script>
</body>
</html>
