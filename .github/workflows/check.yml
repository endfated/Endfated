name: check
on:
  schedule:
    # backup only: GitHub runs this every few hours at best. Main trigger = cron-job.org every 5 min (README)
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ps5-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pw
        run: echo "v=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ steps.pw.outputs.v }}
      - run: npx playwright install --with-deps chromium # browser download skipped on cache hit
      - run: npm run check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Commit status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/status.json README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "status update"
          git pull --rebase -X theirs
          git push
