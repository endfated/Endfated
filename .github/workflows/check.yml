name: check
# Each run loops for ~5.5 h, checking every minute, and keeps a successor waiting in the queue
# (workflow_dispatch via GITHUB_TOKEN may start new runs), so the next run starts the moment this one ends.
# watchdog.yml restarts the chain if it ever breaks completely.
on:
  workflow_dispatch:
    inputs:
      loop_for:
        description: 'Loop duration in seconds (test only)'
        default: '19800'
permissions:
  contents: write
  actions: write
concurrency:
  group: ps5-check
  cancel-in-progress: false
env:
  INTERVAL: 60    # seconds between checks (one check takes ~15 s)
  LOOP_FOR: ${{ inputs.loop_for || '19800' }} # 5.5 h, job limit is 6 h
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
      # queue the successor before anything else can fail; it starts the moment this run ends
      - run: bash scripts/ensure-run.sh queued pending waiting requested
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # use the Chrome preinstalled on the runner: no download, no apt (apt mirrors sometimes hang for minutes)
      - name: Browser
        timeout-minutes: 5
        run: |
          if [ -x /usr/bin/google-chrome ]; then echo "CHROMIUM_PATH=/usr/bin/google-chrome" >> "$GITHUB_ENV"
          else npx playwright install --with-deps chromium; fi
      - name: Check loop
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          end=$((SECONDS + LOOP_FOR)) n=0
          while [ $SECONDS -lt $end ]; do
            start=$SECONDS
            # re-check every 5 rounds that a successor is queued (in background: never blocks or stops the loop)
            if [ $((++n % 5)) = 0 ]; then bash scripts/ensure-run.sh queued pending waiting requested & fi
            echo "::group::check $(date -u +%H:%M)"
            timeout 150 npm run check || echo "check failed or hung, retry next round"
            git add docs/status.json README.md
            if ! git diff --cached --quiet; then
              git commit -q -m "status update"
              git pull -q --rebase -X theirs origin master && git push -q || echo "push failed, retry next round"
            fi
            echo "::endgroup::"
            sleep $(( INTERVAL - (SECONDS - start) > 0 ? INTERVAL - (SECONDS - start) : 1 ))
          done
