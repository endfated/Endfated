name: check
# Each run loops for ~5.5 h, checking every minute. At its start it queues its successor
# (workflow_dispatch via GITHUB_TOKEN is allowed to start a new run), so there is no gap.
# The schedule is only a backup that restarts the chain if it ever breaks.
on:
  schedule:
    - cron: '7 */2 * * *'
  workflow_dispatch:
    inputs:
      loop_for:
        description: 'Loop duration in seconds (test only)'
        default: '19800'
permissions:
  contents: write
  actions: write
concurrency:
  group: ps5-check
  cancel-in-progress: false
env:
  INTERVAL: 60    # seconds between checks (one check takes ~15 s)
  LOOP_FOR: ${{ inputs.loop_for || '19800' }} # 5.5 h, job limit is 6 h
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      # queue the successor right away: it waits (concurrency group) and starts the moment this run ends,
      # however it ends (done, failed, timed out, cancelled). Only one pending run is ever kept.
      - name: Queue next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run check.yml --repo ${{ github.repository }} --ref master
      - uses: actions/checkout@v5
        with:
          ref: master
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # use the Chrome preinstalled on the runner: no download, no apt (apt mirrors sometimes hang for minutes)
      - name: Browser
        timeout-minutes: 5
        run: |
          if [ -x /usr/bin/google-chrome ]; then echo "CHROMIUM_PATH=/usr/bin/google-chrome" >> "$GITHUB_ENV"
          else npx playwright install --with-deps chromium; fi
      - name: Check loop
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          end=$((SECONDS + LOOP_FOR))
          while [ $SECONDS -lt $end ]; do
            start=$SECONDS
            echo "::group::check $(date -u +%H:%M)"
            timeout 150 npm run check || echo "check failed or hung, retry next round"
            git add docs/status.json README.md
            if ! git diff --cached --quiet; then
              git commit -q -m "status update"
              git pull -q --rebase -X theirs origin master && git push -q || echo "push failed, retry next round"
            fi
            echo "::endgroup::"
            sleep $(( INTERVAL - (SECONDS - start) > 0 ? INTERVAL - (SECONDS - start) : 1 ))
          done
