name: watchdog
# Last line of defence: restarts the check chain if no check run is running or waiting.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts
      - run: bash scripts/ensure-run.sh in_progress queued pending waiting requested
        env:
          GH_TOKEN: ${{ github.token }}
